<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atemschutz-Verwendungsliste</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Signature Pad -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <!-- jsPDF & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .header-title {
            background-color: #c0392b;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
        }
        .card {
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .signature-container {
            border: 2px dashed #ccc;
            border-radius: 6px;
            background-color: #fff;
            position: relative;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 180px;
            display: block;
        }
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container my-4 my-md-5" id="form-container">
    <div class="card">
        <div class="header-title text-center">
            <h2 class="mb-1">🚒 Feuerwehr Krugzell</h2>
            <h4 class="mb-0">Atemschutz-Verwendungsnachweis</h4>
        </div>
        <div class="card-body p-4">
            <form id="atemschutzForm">
                <!-- Allgemeine Einsatzdaten -->
                <h5 class="text-danger border-bottom pb-2 mb-3">1. Allgemeine Angaben</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="anlass" class="form-label fw-bold">Anlass / Grund</label>
                        <select class="form-select" id="anlass" required>
                            <option value="" disabled selected>Bitte wählen...</option>
                            <option value="Einsatz">Einsatz</option>
                            <option value="Übung">Übung</option>
                            <option value="Atemschutzstrecke">Atemschutzstrecke</option>
                            <option value="Sonstiges">Sonstiges</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="datum" class="form-label fw-bold">Datum</label>
                        <input type="date" class="form-select" id="datum" required>
                    </div>
                    <div class="col-12">
                        <label for="einsatzort" class="form-label fw-bold">Einsatzort / Übungsobjekt</label>
                        <input type="text" class="form-control" id="einsatzort" placeholder="z. B. Hauptstraße 12 / Feuerwehrhaus" required>
                    </div>
                </div>

                <!-- Personal -->
                <h5 class="text-danger border-bottom pb-2 mt-4 mb-3">2. Atemschutzgeräteträger</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="truppfuehrer" class="form-label fw-bold">Truppführer</label>
                        <select class="form-select" id="truppfuehrer" required>
                            <option value="" disabled selected>Name auswählen...</option>
                            <option value="Max Mustermann">Max Mustermann</option>
                            <option value="Felix Muster">Felix Muster</option>
                            <option value="Florian Kempten">Florian Kempten</option>
                            <!-- Hier weitere Namen ergänzen -->
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="truppmann" class="form-label fw-bold">Truppmann</label>
                        <select class="form-select" id="truppmann" required>
                            <option value="" disabled selected>Name auswählen...</option>
                            <option value="Max Mustermann">Max Mustermann</option>
                            <option value="Felix Muster">Felix Muster</option>
                            <option value="Florian Kempten">Florian Kempten</option>
                            <!-- Hier weitere Namen ergänzen -->
                        </select>
                    </div>
                </div>

                <!-- Zeiten & Drücke -->
                <h5 class="text-danger border-bottom pb-2 mt-4 mb-3">3. Zeiten & Flaschendrücke</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="zeitAnschluss" class="form-label fw-bold">Anschlusszeit (Start)</label>
                        <input type="time" class="form-control" id="zeitAnschluss" required>
                    </div>
                    <div class="col-md-4">
                        <label for="druckStartTF" class="form-label fw-bold">Druck Start TF (bar)</label>
                        <input type="number" class="form-control" id="druckStartTF" placeholder="z. B. 300" min="0" max="350" required>
                    </div>
                    <div class="col-md-4">
                        <label for="druckStartTM" class="form-label fw-bold">Druck Start TM (bar)</label>
                        <input type="number" class="form-control" id="druckStartTM" placeholder="z. B. 300" min="0" max="350" required>
                    </div>

                    <div class="col-md-4">
                        <label for="zeitRückzug" class="form-label fw-bold">Rückzugszeit</label>
                        <input type="time" class="form-control" id="zeitRückzug">
                    </div>
                    <div class="col-md-4">
                        <label for="druckRückzugTF" class="form-label fw-bold">Druck Rückzug TF (bar)</label>
                        <input type="number" class="form-control" id="druckRückzugTF" placeholder="z. B. 180" min="0" max="350">
                    </div>
                    <div class="col-md-4">
                        <label for="druckRückzugTM" class="form-label fw-bold">Druck Rückzug TM (bar)</label>
                        <input type="number" class="form-control" id="druckRückzugTM" placeholder="z. B. 170" min="0" max="350">
                    </div>

                    <div class="col-md-4">
                        <label for="zeitEnde" class="form-label fw-bold">Endzeit (Ablegen)</label>
                        <input type="time" class="form-control" id="zeitEnde" required>
                    </div>
                    <div class="col-md-4">
                        <label for="druckEndeTF" class="form-label fw-bold">Druck Ende TF (bar)</label>
                        <input type="number" class="form-control" id="druckEndeTF" placeholder="z. B. 60" min="0" max="350" required>
                    </div>
                    <div class="col-md-4">
                        <label for="druckEndeTM" class="form-label fw-bold">Druck Ende TM (bar)</label>
                        <input type="number" class="form-control" id="druckEndeTM" placeholder="z. B. 50" min="0" max="350" required>
                    </div>
                </div>

                <!-- Bemerkungen -->
                <h5 class="text-danger border-bottom pb-2 mt-4 mb-3">4. Bemerkungen / Besonderheiten</h5>
                <div class="mb-3">
                    <textarea class="form-control" id="bemerkungen" rows="2" placeholder="Besondere Vorkommnisse, Belastung, Mängel an Geräten..."></textarea>
                </div>

                <!-- Digitale Unterschrift -->
                <h5 class="text-danger border-bottom pb-2 mt-4 mb-3">5. Bestätigung & Unterschrift</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold">Unterschrift (Truppführer / Atemschutzüberwachung)</label>
                    <div class="signature-container">
                        <canvas id="signature-pad"></canvas>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2 no-print" id="clear-signature">Unterschrift löschen</button>
                </div>

                <!-- Buttons -->
                <hr class="my-4">
                <div class="d-grid gap-2 d-md-flex justify-content-md-end no-print">
                    <button type="button" class="btn btn-secondary btn-lg me-md-2" onclick="window.print()">
                        🖨️ Drucken
                    </button>
                    <button type="submit" class="btn btn-danger btn-lg" id="submitBtn">
                        📄 PDF erstellen & per E-Mail senden
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. Datum auf heute vorbelegen
    document.getElementById('datum').valueAsDate = new Date();

    // 2. EmailJS Initialisierung
    // WICHTIG: Ersetze 'YOUR_PUBLIC_KEY' durch deinen echten EmailJS Public Key
    (function() {
        emailjs.init("YOUR_PUBLIC_KEY");
    })();

    // 3. Signature Pad Setup & Canvas Scaling
    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255, 255, 255)'
    });

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.getElementById('clear-signature').addEventListener('click', () => {
        signaturePad.clear();
    });

    // 4. Formularübermittlung & PDF-Generierung + E-Mail
    document.getElementById('atemschutzForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (signaturePad.isEmpty()) {
            alert('Bitte leiste eine Unterschrift vor dem Absenden!');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Erstelle PDF & sende E-Mail...';

        try {
            // PDF aus dem Formularbereich generieren
            const { jsPDF } = window.jspdf;
            const formElement = document.getElementById('form-container');

            const canvasImage = await html2canvas(formElement, {
                scale: 2,
                useCORS: true,
                ignoreElements: (element) => element.classList.contains('no-print')
            });

            const imgData = canvasImage.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 210; // A4 Breite in mm
            const pageHeight = 295; // A4 Höhe in mm
            const imgHeight = (canvasImage.height * imgWidth) / canvasImage.width;

            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            const pdfBase64 = pdf.output('datauristring'); // Base64 Data URL für EmailJS

            // Formulardaten für die E-Mail-Vorlage sammeln
            const emailParams = {
                anlass: document.getElementById('anlass').value,
                datum: document.getElementById('datum').value,
                einsatzort: document.getElementById('einsatzort').value,
                truppfuehrer: document.getElementById('truppfuehrer').value,
                truppmann: document.getElementById('truppmann').value,
                zeit_start: document.getElementById('zeitAnschluss').value,
                zeit_ende: document.getElementById('zeitEnde').value,
                bemerkungen: document.getElementById('bemerkungen').value || 'Keine',
                pdf_attachment: pdfBase64 // Optional für Vorlagen mit Attachment-Unterstützung
            };

            // E-Mail via EmailJS versenden
            // WICHTIG: Ersetze 'YOUR_SERVICE_ID' und 'YOUR_TEMPLATE_ID'
            await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', emailParams);

            alert('Atemschutz-Verwendungsliste erfolgreich als PDF generiert und per E-Mail versendet!');
            
            // Optional: PDF direkt im Browser herunterladen
            pdf.save(`Atemschutz_${document.getElementById('datum').value}_${document.getElementById('truppfuehrer').value}.pdf`);

        } catch (error) {
            console.error('Fehler beim Erstellen/Versenden:', error);
            alert('Fehler beim Versenden der E-Mail: ' + JSON.stringify(error));
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '📄 PDF erstellen & per E-Mail senden';
        }
    });
</script>

</body>
</html>
